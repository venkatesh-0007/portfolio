<svg fill="none" viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #050505;
          color: #ffffff;
          font-family: "Syne", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          position: relative;
          overflow: hidden;
          box-sizing: border-box;
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 12px;
        }
        .glow {
          position: absolute;
          width: 400px;
          height: 400px;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(0,0,0,0) 70%);
          border-radius: 50%;
          animation: float 8s ease-in-out infinite;
          opacity: 0.8;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
        }
        .glow-secondary {
          position: absolute;
          width: 250px;
          height: 250px;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, rgba(0,0,0,0) 70%);
          border-radius: 50%;
          animation: float-alt 6s ease-in-out infinite;
          top: 30%;
          left: 30%;
        }
        .grid {
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
          background-size: 30px 30px;
          opacity: 0.5;
          animation: grid-move 20s linear infinite;
        }
        .name {
          font-size: 40px;
          font-weight: 800;
          letter-spacing: -0.02em;
          margin: 0;
          z-index: 10;
          animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
          opacity: 0;
          transform: translateY(20px);
          color: rgba(255, 255, 255, 0.65);
          display: flex;
          align-items: center;
        }
        .accent {
          color: #ffffff;
        }
        .cmd {
          color: #ffffff;
          margin-right: 12px;
          animation: pulse-cmd 2.5s ease-in-out infinite;
        }
        .role {
          font-size: 15px;
          font-weight: 600;
          color: rgba(255, 255, 255, 0.4);
          margin-top: 12px;
          z-index: 10;
          letter-spacing: 0.1em;
          animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
          opacity: 0;
          transform: translateY(20px);
        }
        @keyframes grid-move {
          from { background-position: 0 0; }
          to { background-position: 30px 30px; }
        }
        @keyframes float {
          0%, 100% { transform: translate(-50%, -50%) scale(1); }
          50% { transform: translate(-50%, -50%) scale(1.15); }
        }
        @keyframes float-alt {
          0%, 100% { transform: translate(0, 0); }
          50% { transform: translate(20px, 20px); }
        }
        @keyframes slideUp {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse-cmd {
          0%, 100% { opacity: 0.5; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.1); }
        }
      </style>
      <div class="container">
        <div class="grid"></div>
        <div class="glow"></div>
        <div class="glow-secondary"></div>
        <h1 class="name"><span class="cmd">⌘</span>Amudalapalli <span class="accent">Venkateswara Rao</span></h1>
        <p class="role">DATA SCIENCE STUDENT &amp; AI / ML ENGINEER</p>
      </div>
    </div>
  </foreignObject>
</svg>
